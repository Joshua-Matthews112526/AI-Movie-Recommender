<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>
        Movie Recommender
    </title>
</head>

<body>

    <h1>Movie Recommender</h1>

    <p>
        Enter any preferences you already know.
        Everything is optional.
    </p>

    <form
        method="GET"
        action="/compare"
    >

        <p>
            <label for="max_runtime">
                Maximum Runtime:
            </label>

            <input
                type="number"
                id="max_runtime"
                name="max_runtime"
                placeholder="Minutes"
                min="1"
            >
        </p>

        <p>
            <label for="genre">
                Preferred Genre:
            </label>

            <input
                type="text"
                id="genre"
                name="genre"
                placeholder="Sci-Fi"
            >
        </p>

        <button type="submit">
            Start Finding a Movie
        </button>

    </form>

</body>

</html>
